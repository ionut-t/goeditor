name: Bark

# When a PR is opened, Bark writes its description and then reviews it
# (PRs from chore/, docs/ and build/ branches get the description only).
# Labels re-run either job on request:
#   "bark: describe" generates the PR description.
#   "bark: review"   reviews the PR.
# Each job removes its label when done (even on failure), so adding the label
# again re-runs it. Pushes to an open PR don't trigger anything.
# PRs from forks are skipped on open: GitHub gives their workflows no secrets
# and a read-only token, so Bark can't run on them here.
on:
  pull_request:
    types: [opened, labeled]

jobs:
  pr-description:
    name: Generate PR Description
    runs-on: ubuntu-latest
    if: >-
      (github.event.action == 'opened'
        && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event.action == 'labeled' && github.event.label.name == 'bark: describe')
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: ionut-t/bark/.github/actions/bark-pr-description@main
        with:
          bark-version: latest
          provider: ${{ vars.BARK_PROVIDER }}
          api-key: ${{ secrets.BARK_API_KEY }}
          model: ${{ vars.BARK_DESCRIPTION_MODEL || vars.BARK_MODEL }}
          max-diff-lines: ${{ vars.BARK_MAX_DIFF_LINES }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove describe label
        if: always() && github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --remove-label "bark: describe" || true

  review:
    name: AI Code Review
    needs: pr-description
    # always() lets the job run when pr-description is skipped (a "bark: review" label).
    # On open, the review waits for the description so it can read it.
    if: >-
      always() && (
        (github.event.action == 'opened' && needs.pr-description.result == 'success'
          && !startsWith(github.head_ref, 'chore/')
          && !startsWith(github.head_ref, 'docs/')
          && !startsWith(github.head_ref, 'build/'))
        || (github.event.action == 'labeled' && github.event.label.name == 'bark: review')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: ionut-t/bark/.github/actions/bark-review@main
        with:
          bark-version: latest
          provider: ${{ vars.BARK_PROVIDER }}
          api-key: ${{ secrets.BARK_API_KEY }}
          model: ${{ vars.BARK_MODEL }}
          reviewer: ${{ vars.BARK_REVIEWER }}
          max-diff-lines: ${{ vars.BARK_MAX_DIFF_LINES }}
          with-description: "true"
          with-context: ${{ vars.BARK_WITH_CONTEXT }}
          inline-comments: ${{ vars.BARK_INLINE_COMMENTS }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove review label
        if: always() && github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --remove-label "bark: review" || true
